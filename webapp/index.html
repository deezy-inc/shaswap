<style>
  :root {
    /* dark-first: a focused, non-custodial financial tool reads best on a calm dark surface */
    /* Qbit brand palette (from qbit.org) — green accent on a green-tinted dark base */
    --bg:#07110b; --surface:#0e1712; --surface-2:#14211b; --raised:#1a2c22;
    --line:#1e3327; --line-2:#294435;
    --ink:#e9f2ec; --ink-2:#c0d0c6; --mut:#7f948a;
    --accent:#1ab453; --accent-ink:#03130a; --accent-soft:rgba(26,180,83,.15); --accent-line:rgba(26,180,83,.42); --accent-bright:#20c760;
    --good:#20c760; --good-soft:rgba(32,199,96,.15);
    --warn:#e7b45a; --warn-soft:rgba(231,180,90,.14);
    --bad:#ec6a75;  --bad-soft:rgba(236,106,117,.14);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --r:10px; --r-lg:16px;
    --fg:var(--ink); --panel:var(--surface); --panel2:var(--surface-2);   /* back-compat aliases */
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --ring:0 0 0 3px var(--accent-soft);
    --ease:cubic-bezier(.22,.61,.36,1); --dur:.17s;
    color-scheme:dark;
  }
  /* bip110 brand (shaswap): Bitcoin orange on a warm neutral black — activated server-side via
     <html data-brand="bip110">. Semantic good/warn/bad stay untouched; only the identity hue moves. */
  :root[data-brand="bip110"] {
    --bg:#0b0a08; --surface:#141210; --surface-2:#1b1813; --raised:#242019;
    --line:#2b251c; --line-2:#3d3424;
    --ink:#f2eee7; --ink-2:#d3cbbf; --mut:#958b7a;
    --accent:#f7931a; --accent-ink:#1a0f00; --accent-soft:rgba(247,147,26,.15);
    --accent-line:rgba(247,147,26,.45); --accent-bright:#ffa733;
  }
  /* the hero halo/glow are hardcoded green above — re-tint for the orange brand */
  :root[data-brand="bip110"] .hero::before { background:radial-gradient(circle at center, rgba(247,147,26,.14), transparent 60%) !important; }
  :root[data-brand="bip110"] .hero-emblem { filter:drop-shadow(0 8px 30px rgba(247,147,26,.28)); }
  /* pair-coin mark is wide (64x40), not square — let it breathe */
  :root[data-brand="bip110"] .mark { width:40px; }
  :root[data-brand="bip110"] .mark svg { width:40px; height:25px; }
  /* Dark mode always (Qbit brand look) — no light-mode override. */
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:400 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    font-feature-settings:"cv05","ss01"; letter-spacing:-0.006em;
  }
  ::selection { background:var(--accent-soft); }

  /* header */
  header { display:flex; align-items:center; gap:11px; padding:16px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(var(--surface),var(--bg)); position:sticky; top:0; z-index:20; backdrop-filter:saturate(1.2); }
  .mark { width:27px; height:27px; flex:none; display:grid; place-items:center; color:var(--accent); cursor:pointer; }
  .mark svg { width:27px; height:27px; display:block; }
  header h1 { font-size:15px; font-weight:650; margin:0; letter-spacing:-.01em; cursor:pointer; }
  header .tag { color:var(--mut); font-size:12.5px; margin-left:2px; }
  @media (max-width:560px){ header .tag, header h1 { display:none; } }   /* mobile: drop the wordmark, keep the logo (still clickable → home) */
  .navlink { color:var(--mut); font-size:13px; font-weight:550; cursor:pointer; text-decoration:none; }
  .navlink:hover { color:var(--ink); }
  #info-link { margin-left:auto; }   /* anchors the right-hand nav group; trades-link takes over when shown */
  .gh { margin-left:10px; display:inline-grid; place-items:center; width:32px; height:32px; border-radius:8px; color:var(--mut);
    border:1px solid transparent; transition:color var(--dur), background var(--dur), border-color var(--dur); }
  .gh:hover { color:var(--ink); background:var(--surface-2); border-color:var(--line); }
  .gh svg { width:19px; height:19px; }
  #lang { display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px; }
  #lang a { font-size:12px; font-weight:550; padding:3px 10px; border-radius:999px; color:var(--mut); text-decoration:none; transition:color var(--dur), background var(--dur); }
  #lang a[aria-current="true"] { color:var(--ink); background:var(--raised); box-shadow:0 1px 2px rgba(0,0,0,.2); }
  #lang a:hover { color:var(--ink); }

  main { max-width:1000px; margin:0 auto; padding:clamp(26px,4vw,44px) 20px 72px; }

  /* card — one content container per wizard screen (not decorative repetition). Capped so the wizard
     stays a focused 560px column inside the wider page shell the landing uses. */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:22px; margin:0 auto 15px; max-width:560px; box-shadow:var(--shadow); animation:enter .26s var(--ease) both; }
  .card h2 { color:var(--ink); font-size:19px; font-weight:660; letter-spacing:-.015em; margin:0 0 8px; text-wrap:balance; line-height:1.28; }
  .card h3 { margin:0; }
  @keyframes enter { from { opacity:0; transform:translateY(6px) scale(.995); } to { opacity:1; transform:none; } }
  /* blocking modal (replay-protection acknowledgment) — fixed overlay above the wizard card */
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center;
    justify-content:center; z-index:60; padding:20px; backdrop-filter:blur(2px); }
  .modal { background:var(--surface); border:1px solid var(--warn); border-radius:var(--r-lg);
    padding:22px; width:100%; max-width:460px; box-shadow:var(--shadow); animation:enter .26s var(--ease) both; }

  .muted { color:var(--mut); }
  /* body-adjacent helper text — kept high enough contrast to read (≥4.5:1), not decorative gray */
  .note { font-size:13px; line-height:1.5; color:var(--ink-2); margin:9px 0 0; }
  .note.dim { color:var(--mut); }
  a { color:var(--accent); text-decoration:none; font-weight:500; }
  a:hover { text-decoration:underline; text-underline-offset:2px; }

  /* forms */
  label { display:block; font-size:12.5px; font-weight:550; color:var(--mut); margin:14px 0 5px; }
  input, select { width:100%; padding:11px 12px; background:var(--surface-2); color:var(--ink);
    border:1px solid var(--line-2); border-radius:var(--r); font:inherit; letter-spacing:-.005em;
    transition:border-color var(--dur), box-shadow var(--dur), background var(--dur); }
  input::placeholder { color:var(--mut); }
  input:hover, select:hover { border-color:var(--mut); }
  input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:var(--ring); background:var(--surface); }
  input[type=checkbox] { width:18px; height:18px; accent-color:var(--accent); margin:1px 0 0; }
  /* Below-minimum amount: persistent red border + tint, with a brief flash re-triggered on each offending keystroke. */
  input.field-err, input.field-err:hover { border-color:var(--bad); background:var(--bad-soft); }
  input.field-err:focus { border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-soft); background:var(--bad-soft); }
  @keyframes fieldflash { 0%{ background:var(--bad-soft); } 40%{ background:rgba(236,106,117,.34); } 100%{ background:var(--bad-soft); } }
  input.field-err.flash { animation:fieldflash .45s ease-out; }
  /* Small fee note tucked under an amount input, with breathing room before the next field. */
  .fee-note { margin:7px 2px 13px; font-size:12.5px; color:var(--mut); line-height:1.45; }
  .row { display:flex; gap:12px; } .row > * { flex:1; min-width:0; }

  /* buttons — full state set + motion that conveys press/feedback */
  button { font:inherit; font-weight:550; letter-spacing:-.005em; color:var(--ink); cursor:pointer;
    padding:10px 15px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--raised);
    transition:transform var(--dur) var(--ease), border-color var(--dur), background var(--dur), box-shadow var(--dur), opacity var(--dur); }
  button:hover { border-color:var(--mut); background:var(--surface-2); }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:none; box-shadow:var(--ring); border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:transparent; color:var(--accent-ink); font-weight:620;
    box-shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 20px -10px var(--accent); }
  button.primary:hover { filter:brightness(1.07); background:var(--accent); border-color:transparent; }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; filter:none; }
  .copy { font-size:12.5px; font-weight:550; padding:6px 11px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; }

  /* the big directional choices on the landing */
  .choice { width:100%; text-align:left; padding:21px 20px; margin-top:13px; display:flex; align-items:center; gap:16px; }
  .choice .glyph { width:42px; height:42px; border-radius:11px; flex:none; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent); font-size:19px; font-weight:700; }
  .choice .ct { display:flex; flex-direction:column; gap:3px; }
  .choice .ct b { font-size:18px; font-weight:640; letter-spacing:-.01em; }
  .choice .ct span { font-size:13.5px; color:var(--mut); font-weight:400; }
  /* secondary card — the resume/recovery section reads as a quieter, utility block */
  .card.secondary { background:transparent; box-shadow:none; border-color:var(--line); padding:15px 17px; margin-top:6px; }
  .card.secondary h2 { font-size:13px; font-weight:600; color:var(--mut); letter-spacing:.01em; margin-bottom:5px; }
  .card.secondary .note { font-size:12.5px; }
  .choice .arr { margin-left:auto; color:var(--mut); transition:transform var(--dur) var(--ease), color var(--dur); }
  .choice:hover .arr { transform:translateX(3px); color:var(--accent); }

  /* code / key-value */
  code, .mono { font-family:var(--mono); font-size:12.5px; word-break:break-all; line-height:1.5; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:13px; align-items:baseline; }
  .kv .mono { background:var(--surface-2); padding:3px 7px; border-radius:6px; }
  .amt, .num { font-variant-numeric:tabular-nums; }

  /* recent-trades table */
  .trades { width:100%; border-collapse:collapse; margin-top:6px; }
  .trades th, .trades td { text-align:right; padding:9px 6px; border-bottom:1px solid var(--line); font-size:13.5px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .trades th { color:var(--mut); font-weight:550; font-size:12px; }
  .trades th:first-child, .trades td:first-child { text-align:left; }
  .trades td.when { color:var(--mut); }
  /* content pages (Info / Activity) — wider, landing-like, not a cramped card */
  .page { max-width:880px; margin:0 auto; padding:clamp(2px,1.5vw,14px) 0 32px; animation:enter .42s ease both; }
  .page-head { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:clamp(12px,2vw,18px); }
  .page-head h1 { font-size:clamp(1.7rem,3.6vw,2.4rem); letter-spacing:-.03em; font-weight:680; color:var(--ink); margin:0; }
  .page-back { color:var(--mut); font-size:14px; white-space:nowrap; }
  .page-back:hover { color:var(--ink); }
  .page-intro { color:var(--mut); font-size:15.5px; line-height:1.6; max-width:62ch; margin:0; }
  .page-section { border-top:1px solid var(--line); padding-top:clamp(24px,4vw,36px); margin-top:clamp(26px,4vw,38px); }
  .page-section > h2 { font-size:clamp(1.2rem,2.4vw,1.5rem); letter-spacing:-.02em; font-weight:640; color:var(--ink); margin:0 0 clamp(16px,2.4vw,22px); }
  .info-steps { display:grid; gap:13px; margin-top:clamp(18px,2.5vw,24px); }
  .info-step { display:flex; gap:13px; align-items:flex-start; }
  .info-step .n { flex:none; width:27px; height:27px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700;
    color:var(--accent); background:var(--surface); border:1px solid var(--accent-line); }
  .info-step p { color:var(--mut); line-height:1.55; margin:2px 0 0; }
  .qa-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 24px; }
  .qa { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .qa .q { font-weight:620; color:var(--ink); margin-bottom:6px; font-size:15px; }
  .qa .a { color:var(--mut); font-size:13.7px; line-height:1.58; margin:0; }
  .qa .a a { color:var(--accent); }
  @media (max-width:640px){ .qa-grid { grid-template-columns:1fr; } }
  /* API reference — a compact reference-doc layout: labeled base-URL field, an auth callout, and
     one card per section holding aligned endpoint rows (method column · path · auth chip · blurb). */
  .api-base { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:11px 14px; margin-top:16px; }
  .api-base .lbl { font-size:10.5px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); flex:none; }
  .api-base .url { font-family:var(--mono); font-size:13px; color:var(--ink); word-break:break-all; }
  .api-authbox { display:flex; gap:12px; align-items:flex-start; background:var(--accent-soft); border:1px solid var(--accent-line);
    border-radius:10px; padding:13px 15px; margin-top:12px; max-width:none; }
  .api-authbox .ico { flex:none; color:var(--accent); margin-top:1px; }
  .api-authbox p { margin:0; font-size:13.3px; line-height:1.58; color:var(--ink-2); }
  .api-authbox code { font-family:var(--mono); font-size:12px; background:rgba(0,0,0,.25); padding:1px 5px; border-radius:4px; color:var(--ink); }
  .api-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .api-card-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:14px 18px; border-bottom:1px solid var(--line); background:linear-gradient(var(--surface-2),var(--surface)); }
  .api-card-head h3 { margin:0; font-size:14.5px; font-weight:640; letter-spacing:-.01em; color:var(--ink); }
  .api-card-head .count { font-size:11px; font-weight:600; letter-spacing:.03em; color:var(--mut); font-variant-numeric:tabular-nums; }
  .api-ep { display:grid; grid-template-columns:52px minmax(0,1fr); gap:2px 14px; padding:13px 18px; border-top:1px solid var(--line); transition:background var(--dur); }
  .api-ep:first-child { border-top:0; }
  .api-ep:hover { background:var(--surface-2); }
  .api-ep .row1 { grid-column:2; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .api-m { grid-row:1; align-self:center; font-size:10px; font-weight:700; padding:3px 0; width:100%; text-align:center; border-radius:5px;
    font-family:var(--mono); letter-spacing:.04em; }
  .api-m.get { color:var(--accent); background:var(--accent-soft); }
  .api-m.post { color:var(--warn); background:var(--warn-soft); }
  .api-path { font-family:var(--mono); font-size:13.5px; color:var(--ink); word-break:break-all; font-weight:500; }
  .api-auth { margin-left:auto; font-size:10px; font-weight:600; letter-spacing:.03em; padding:2px 8px; border-radius:999px;
    border:1px solid var(--line-2); color:var(--mut); white-space:nowrap; }
  .api-auth.tok { color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .api-auth.key { color:var(--warn); border-color:var(--warn-soft); background:var(--warn-soft); }
  .api-desc { grid-column:2; font-size:13px; color:var(--mut); line-height:1.5; margin:5px 0 0; }
  .api-desc code { font-family:var(--mono); font-size:12px; background:var(--surface-2); padding:1px 5px; border-radius:4px; color:var(--ink-2); }
  .api-groups { display:flex; flex-direction:column; gap:18px; margin-top:8px; }
  @media (max-width:560px){ .api-ep { grid-template-columns:1fr; } .api-m { width:48px; grid-row:auto; } .api-ep .row1, .api-desc { grid-column:1; } }
  /* Resume-a-swap button: timestamp on top, trade amounts smaller below. */
  .resume-btn { line-height:1.3; padding:11px 14px; }
  .resume-when { font-size:14.5px; font-weight:640; }
  .resume-amt { font-size:12px; font-weight:520; opacity:.82; margin-top:2px; }
  .trades-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:2px 18px 8px; margin-top:clamp(18px,2.5vw,24px); overflow-x:auto; }
  /* swap progress timeline (live screen) — steps stay visible with tx explorer links */
  .timeline { margin-top:16px; border-top:1px solid var(--line); padding-top:14px; }
  .tl-step { display:flex; align-items:flex-start; gap:11px; padding:6px 0; }
  .tl-icon { flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; box-sizing:border-box; }
  .tl-icon.done { color:var(--accent-ink); background:var(--accent); }
  .tl-icon.active { color:var(--accent); border:2px solid var(--accent); animation:pulse 2s infinite; }
  .tl-icon.todo { color:var(--mut); border:1px solid var(--line); font-size:8px; }
  .tl-body { padding-top:1px; line-height:1.35; flex:1; min-width:0; }
  .tl-label { color:var(--ink); font-size:14.5px; font-weight:550; }
  .tl-step.todo .tl-label { color:var(--mut); font-weight:400; }
  .tl-tx { display:block; font-size:12px; margin-top:1px; }
  .tl-tx a { color:var(--accent); font-family:var(--mono); }
  .tl-tx a:hover { text-decoration:underline; }
  .tl-mem { color:var(--warn); }
  .tl-conf { display:block; font-size:11.5px; color:var(--mut); margin-top:1px; font-variant-numeric:tabular-nums; }
  /* The "do this now" box, rendered inline on the active step: reclaim the icon+gap indent (22+11px) so
     the deposit address still spans the full card width and fits on one line. */
  .tl-body .fund { margin:10px 0 4px -33px; }
  /* Paused (underfunded): cross out the steps that can no longer proceed. */
  .tl-step.paused .tl-label { text-decoration:line-through; color:var(--mut); font-weight:400; }
  .tl-step.paused .tl-icon { animation:none; opacity:.5; }

  /* status badge — soft tinted fill, not just an outline */
  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
    font-size:11.5px; font-weight:640; letter-spacing:.02em; text-transform:uppercase;
    background:var(--surface-2); color:var(--mut); border:1px solid var(--line); }
  .badge.good { color:var(--good); background:var(--good-soft); border-color:transparent; }
  .badge.warn { color:var(--warn); background:var(--warn-soft); border-color:transparent; }
  .badge.bad  { color:var(--bad);  background:var(--bad-soft);  border-color:transparent; }
  .badge.info { color:var(--accent); background:var(--accent-soft); border-color:transparent; }

  /* the deposit / amount panel — the pivotal moment of the flow */
  .fund { background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; margin:14px 0 0; }
  .fund .amt { font-size:26px; font-weight:680; letter-spacing:-.02em; line-height:1.1; margin:5px 0; }
  .fund .mono { display:block; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 9px; margin-top:8px; font-size:12px; letter-spacing:-.015em; }

  /* status dot for presence / safety net */
  .dot { width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; }
  .dot.live { background:var(--good); box-shadow:0 0 0 0 var(--good-soft); animation:pulse 2.4s var(--ease) infinite; }
  .dot.idle { background:var(--warn); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(32,199,96,.5);} 70%{box-shadow:0 0 0 6px rgba(32,199,96,0);} 100%{box-shadow:0 0 0 0 rgba(32,199,96,0);} }
  .statusline { display:flex; align-items:center; gap:8px; }

  /* ── landing (marketing) ───────────────────────────────────────────────── */
  .landing { padding-top:clamp(12px,3vw,32px); }
  .hero { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center;
    padding-bottom:clamp(44px,8vw,88px); }
  .hero::before { content:""; position:absolute; top:-6%; left:50%; transform:translateX(-50%);
    width:min(620px,94%); aspect-ratio:1/.8; background:radial-gradient(circle at center, rgba(26,180,83,.16), transparent 60%);
    z-index:0; pointer-events:none; }
  .hero > * { position:relative; z-index:1; animation:heroIn .6s var(--ease) both; }
  .hero-emblem { width:clamp(94px,18vw,128px); margin-bottom:clamp(20px,3vw,30px);
    filter:drop-shadow(0 8px 30px rgba(26,180,83,.3)); animation-delay:.02s; }
  .hero-emblem svg { width:100%; height:auto; display:block; }
  .hero-emblem .core { fill:var(--accent); }
  .hero-emblem .orbit { fill:var(--accent-bright); transform-origin:160px 160px; animation:orbit 18s linear infinite; }
  .hero-emblem.boot .orbit { animation-duration:1.5s; }   /* faster spin while the app boots — reads as a loading indicator */
  @keyframes orbit { to { transform:rotate(360deg); } }
  .hero-kicker { font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin-bottom:16px; animation-delay:.08s; }
  .hero h1 { font-size:clamp(2rem,5.4vw,3.6rem); line-height:1.04; letter-spacing:-.032em; font-weight:680;
    margin:0; max-width:17ch; text-wrap:balance; color:var(--ink); animation-delay:.14s; }
  .hero-sub { font-size:clamp(15px,1.85vw,18px); line-height:1.55; color:var(--ink-2); max-width:58ch;
    margin:18px auto 0; text-wrap:pretty; animation-delay:.22s; }
  .hero-cta { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:clamp(24px,3.5vw,34px);
    animation-delay:.3s; }
  .btn-lg { font-size:15.5px; font-weight:620; padding:13px 26px; border-radius:12px; }
  .btn-ghost { background:transparent; border-color:var(--line-2); color:var(--ink); }
  .btn-ghost:hover { background:var(--surface-2); border-color:var(--mut); }
  @keyframes heroIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* instant-swap widget (RFQ maker liquidity; flag QBIT_RFQ) — Uniswap-style pay/receive panels */
  .inst { width:100%; max-width:440px; margin:clamp(22px,3.2vw,30px) auto 4px; text-align:left; animation:heroIn .6s var(--ease) both; animation-delay:.26s; }
  .inst-panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 16px 15px; box-shadow:var(--shadow); transition:border-color var(--dur); }
  .inst-panel:focus-within { border-color:var(--accent-line); }
  .inst-label { font-size:12.5px; font-weight:550; color:var(--mut); }
  .inst-row { display:flex; align-items:center; gap:10px; margin-top:4px; }
  .inst-amt, .inst-amt:hover, .inst-amt:focus { width:auto; flex:1; min-width:0; background:transparent; border:none; box-shadow:none; outline:none; padding:0;
    color:var(--ink); font-size:27px; font-weight:640; letter-spacing:-.02em; }
  .inst-coin { flex:none; display:inline-flex; align-items:center; background:var(--raised); border:1px solid var(--line-2); border-radius:999px; padding:6px 14px; font-weight:650; font-size:14.5px; color:var(--ink); }
  .inst-fee { font-size:12px; color:var(--mut); margin-top:6px; }
  .inst-switch { position:relative; z-index:2; display:grid; place-items:center; width:38px; height:38px; margin:-12px auto; padding:0;
    background:var(--surface-2); border:3px solid var(--bg); border-radius:12px; color:var(--ink-2); font-size:17px; line-height:1; cursor:pointer; transition:color var(--dur), background var(--dur); }
  .inst-switch:hover { color:var(--accent); background:var(--raised); }
  .inst-meta { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:10px; min-height:19px; font-size:13px; }
  .inst-status { color:var(--ink-2); }
  .inst-avail { color:var(--mut); font-size:12.5px; text-align:right; }
  .inst-cta { width:100%; margin-top:12px; }

  .features { border-top:1px solid var(--line); padding-top:clamp(38px,6vw,58px); }
  .features h2 { text-align:center; font-size:clamp(1.35rem,2.6vw,1.75rem); letter-spacing:-.02em;
    font-weight:640; color:var(--ink); margin:0 0 clamp(28px,4vw,42px); }
  .feature-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:clamp(24px,3vw,36px) clamp(28px,3.4vw,44px); }
  .feature .flabel { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:640;
    letter-spacing:-.01em; color:var(--ink); }
  .feature .fdot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none;
    box-shadow:0 0 0 4px var(--accent-soft); }
  .feature p { font-size:13.5px; line-height:1.55; color:var(--ink-2); margin:8px 0 0; max-width:44ch; }

  /* how-it-works numbered timeline */
  .steps-section { border-top:1px solid var(--line); padding-top:clamp(38px,6vw,58px); margin-top:clamp(40px,6vw,64px); }
  .steps-section h2 { text-align:center; font-size:clamp(1.35rem,2.6vw,1.75rem); letter-spacing:-.02em;
    font-weight:640; color:var(--ink); margin:0 0 clamp(30px,4vw,44px); }
  .steps { max-width:600px; margin:0 auto; }
  .about { border-top:1px solid var(--line); padding-top:clamp(38px,6vw,58px); margin-top:clamp(40px,6vw,64px); text-align:center; }
  .about h2 { font-size:clamp(1.35rem,2.6vw,1.75rem); letter-spacing:-.02em; font-weight:640; color:var(--ink); margin:0 0 16px; }
  .about-body { max-width:560px; margin:0 auto; color:var(--mut); line-height:1.65; }
  .about-body a { color:var(--accent); }
  .step { position:relative; display:flex; gap:18px; padding-bottom:26px; }
  .step:last-child { padding-bottom:0; }
  .step:not(:last-child)::before { content:""; position:absolute; left:18px; top:38px; bottom:2px; width:2px;
    background:linear-gradient(var(--accent-line), var(--line)); }
  .step-num { width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-weight:700; font-size:15px; color:var(--accent); background:var(--surface); border:1px solid var(--accent-line);
    box-shadow:0 0 0 4px var(--bg); position:relative; z-index:1; }
  .step-body { padding-top:6px; }
  .step-body b { display:block; font-size:16px; font-weight:640; letter-spacing:-.01em; color:var(--ink); }
  .step-body p { font-size:13.5px; line-height:1.55; color:var(--ink-2); margin:3px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    .card, .hero > *, .hero-emblem .orbit { animation:none; }
  }
</style>
